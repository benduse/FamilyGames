# Render Blueprint: creates the API and the PostgreSQL database in one step.
# In Render: New > Blueprint > pick this repo.
databases:
  - name: family-games-db
    plan: free          # free databases expire after 30 days; upgrade before real use
    databaseName: family_games

services:
  - type: web
    name: family-games-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: family-games-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://YOUR-SITE.netlify.app
      - key: TRUST_PROXY
        value: "2"
